<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALM Holdings</title>
  <style>
    :root {
      --holdings-blue: #1B365D;
      --alm-crimson: #A81B1B;
      --text-main: #1B365D;
      --text-muted: #5A6B82;
      --bg-base: #FAFAFA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Bespoke Warm Golden Halo - Cut at the Top Edge */
    .halo-backdrop {
      position: absolute;
      top: -135px;
      left: 50%;
      transform: translateX(-50%);
      width: 720px;
      height: 640px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 50% 46%,
        rgba(244, 231, 198, 0.94) 0%,
        rgba(244, 231, 198, 0.74) 32%,
        rgba(246, 236, 210, 0.36) 54%,
        rgba(250, 250, 250, 0) 74%
      );
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 95px 24px 48px 24px;
      text-align: center;
      width: 100%;
      max-width: 1060px;
      margin: 0 auto;
    }

    .hero-top {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Horizontal Lockup: 3D ALM Logo + "Holdings" in normal script side by side */
    .brand-header {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .brand-logo-img {
      height: 56px;
      width: auto;
      display: block;
      transform: translateY(4px);
    }

    .brand-holdings {
      color: var(--holdings-blue);
      font-size: 56px;
      font-weight: 300;
      letter-spacing: -0.5px;
      line-height: 1;
      text-transform: none;
    }

    .brand-nature {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: var(--holdings-blue);
      margin-bottom: 42px;
      padding-left: 2.8px;
    }

    .nav-actions {
      display: flex;
      gap: 18px;
      justify-content: center;
    }

    .btn-action {
      background: #FFFFFF;
      color: var(--holdings-blue);
      border: 1px solid #94A3B8;
      padding: 11px 32px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 140px;
    }

    .btn-action:hover {
      border-color: var(--holdings-blue);
      background: var(--holdings-blue);
      color: #FFFFFF;
    }

    /* 4-Pillar Bottom Architecture */
    .pillars-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 80px;
      padding-top: 32px;
      border-top: 1px solid rgba(27, 54, 93, 0.1);
    }

    .pillar-card {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid #E2E8F0;
      border-radius: 2px;
      padding: 20px 16px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .pillar-card:hover {
      border-color: #CBD5E0;
      box-shadow: 0 6px 18px rgba(27, 54, 93, 0.05);
    }

    .pillar-num {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--alm-crimson);
      margin-bottom: 8px;
    }

    .pillar-title {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--holdings-blue);
      line-height: 1.45;
    }

    @media (max-width: 820px) {
      .pillars-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .pillars-grid {
        grid-template-columns: 1fr;
      }
      .brand-holdings {
        font-size: 42px;
      }
      .brand-logo-img {
        height: 42px;
      }
    }

    /* Internal Modal Window */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 19, 43, 0.55);
      backdrop-filter: blur(3px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #FFFFFF;
      padding: 44px;
      border-radius: 2px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      text-align: left;
    }

    .modal-content h3 {
      margin-top: 0;
      color: var(--holdings-blue);
      font-size: 16px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .modal-content input, .modal-content textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0 20px 0;
      border: 1px solid #CBD5E0;
      border-radius: 2px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
    }

    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid #E2E8F0;
      padding: 24px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(250, 250, 250, 0.9);
    }

    .cacatus-egg {
      color: #F0F0F0; /* Micro easter egg */
      font-size: 8px;
      font-style: italic;
      margin-top: 6px;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>

  <script>
    function openContact() { document.getElementById('contactModal').style.display = 'flex'; }
    function closeContact() { document.getElementById('contactModal').style.display = 'none'; }
    function submitForm(e) {
      e.preventDefault();
      alert("Inquiry dispatched securely. Vanguard Registry acknowledged.");
      closeContact();
    }

    // Keysequence trigger for Flash Cascade ('vanguard')
    let inputSeq = '';
    document.addEventListener('keydown', (e) => {
      inputSeq += e.key.toLowerCase();
      if (inputSeq.length > 8) inputSeq = inputSeq.slice(-8);
      if (inputSeq === 'vanguard') triggerFlashCascade();
    });

    function triggerFlashCascade() {
      const flash = document.createElement('div');
      flash.style.position = 'fixed';
      flash.style.top = '0'; flash.style.left = '0';
      flash.style.width = '100vw'; flash.style.height = '100vh';
      flash.style.background = '#0B132B';
      flash.style.zIndex = '99999';
      flash.style.transition = 'opacity 0.3s ease';
      document.body.appendChild(flash);
      
      setTimeout(() => {
        alert("FLASH CASCADE: Accessing MRM Consulting / Cacatus View.");
        flash.style.opacity = '0';
        setTimeout(() => flash.remove(), 300);
      }, 200);
    }

    // Console Solver Logs
    console.log("%c[VANGUARD SYSTEM MASTER ACTIVE]", "color: #A81B1B; font-weight: bold; font-size: 14px;");
    console.log("Sub-Directory Access Keys:");
    console.log("-> /mrmconsulting (Advisory & Legal Translation)");

    console.log("-> /mrmfilms (4K Media & Asset Telemetry)");
